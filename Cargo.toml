[workspace]
resolver = "2"
members = ["crates/sonora-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.80"

[workspace.dependencies]
sonora-core = { path = "crates/sonora-core" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
